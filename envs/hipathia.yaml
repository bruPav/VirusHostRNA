# Conda environment for HiPathia pathway analysis.
# R 4.4.x so Bioconductor 3.19/3.20 is used (hipathia not on Bioc 3.22).
# Key deps installed via conda to avoid nloptr/lme4/ggpubr and Bioc build failures.
# After creating the env:
#   conda activate hipathia
#   R -e 'BiocManager::install("hipathia")'
name: hipathia
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - r-base=4.4.0
  - r-biocmanager=1.30.23
  - nlopt
  # CRAN deps (avoid source build)
  - r-png=0.1_8
  - r-ggpubr=0.6.0
  - r-lme4=1.1_35.5
  # hipathia deps that need C libs (httpuv needs zlib); pre-built avoids compilation
  - r-httpuv=1.6.15
  - r-servr=0.31
  - zlib
  # Bioconductor deps (avoid order/build issues)
  - bioconductor-genomicranges=1.56.2
  - bioconductor-delayedarray=0.30.1
  - bioconductor-summarizedexperiment=1.34.0
  - bioconductor-biostrings=2.72.1
  - bioconductor-annotationhub=3.12.1
  - bioconductor-multiassayexperiment=1.30.3
  - bioconductor-keggrest=1.44.1
  - bioconductor-annotationdbi=1.66.0
