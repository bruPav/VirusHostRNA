# Main pipeline env (mapping, counts, DESeq2). Enrichment uses envs/enrichment.yaml.
name: ge_analysis
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - fastp=0.23.4
  - fastqc=0.12.1
  - multiqc=1.18
  - star=2.7.11b
  - samtools=1.19
  - rseqc=5.0.4
  - r-base=4.3.3
  - bioconductor-deseq2=1.42.0
  - bioconductor-vsn=3.66.0
  - bioconductor-biomart=2.58.0
  - r-ggplot2=3.5.1
  - r-pheatmap=1.0.12
  - r-ggrepel=0.9.5
  - r-biocmanager=1.30.23
